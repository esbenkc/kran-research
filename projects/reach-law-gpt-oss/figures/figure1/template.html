<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Figure 1: {{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fbfaf8; }
  body { width: 1200px; padding: 32px 40px 28px; font-family: "Inter", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
         color: #1d1d1f; -webkit-font-smoothing: antialiased; }
  .head { font-size: 44px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.13; }
  .sub { font-size: 25px; line-height: 1.32; color: #5f636c; margin-top: 12px; }
  .sub b { color: #2b2e35; font-weight: 700; }
  .sub .q { background: #fbe7a6; color: #2b2e35; border-radius: 4px; padding: 0 3px; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(6, auto); column-gap: 22px; margin-top: 24px; }
  .panel { display: grid; grid-row: span 6; grid-template-rows: subgrid; align-content: start; border-radius: 18px; padding: 18px 18px 20px; background: #f1f2f4; }
  .p-r { background: #eaf5ee; }
  .pt { font-size: 30px; font-weight: 800; line-height: 1.15; text-align: center; margin-bottom: 8px; }
  .p-r .pt { color: #11643a; }
  .cardh { font-size: 19px; color: #6b6f78; font-weight: 600; margin: 12px 0 6px; line-height: 1.25; }
  .card { align-self: start; background: #fff; border: 1px solid #dfe1e5; border-radius: 12px; padding: 6px 0; }
  .ln { display: flex; align-items: flex-start; gap: 10px; padding: 4px 12px; min-height: 34px; }
  .ln code { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 18px; line-height: 1.38; color: #9a9ea6; }
  .l-route { background: #e3f3e8; }
  .l-route code { color: #11643a; font-weight: 700; }
  .l-gap { margin: 4px 12px; border: 2px dashed #c9ccd2; border-radius: 8px; justify-content: center; align-items: center; min-height: 120px; }
  .l-gap code { font-family: inherit; font-size: 20px; color: #9a9ea6; font-style: italic; }
  .l-key { background: #fbe0dc; }
  .l-key code { color: #b3261e; font-weight: 700; }
  .tag { flex: none; width: 136px; text-align: center; font-size: 15px; font-weight: 800; border-radius: 5px; padding: 2px 6px; color: #fff; margin-top: 2px; }
  .t-route { background: #1e7a47; }
  .t-key { background: #b3261e; }
  .say { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; }
  .rb { flex: none; margin-top: 2px; }
  .sayr { flex: 1; }
  .who { font-size: 18px; color: #6b6f78; font-weight: 600; margin-bottom: 4px; }
  .bub { background: #fff; border-radius: 16px 16px 16px 5px; padding: 9px 14px; font-size: 23px; line-height: 1.3; box-shadow: 0 1px 6px rgba(0,0,0,0.09); }
  .bub.pend { color: #8a8e97; font-style: italic; }
  .act { font-size: 24px; font-weight: 800; margin-top: 8px; line-height: 1.2; }
  .act.key { color: #b3261e; } .act.route { color: #11643a; } .act.pend { color: #8a8e97; font-weight: 700; }
  .bars { margin-top: 22px; padding-top: 14px; border-top: 2px solid #e2e3e7; }
  .barh { font-size: 26px; font-weight: 800; line-height: 1.2; margin-bottom: 4px; }
  .bar { display: grid; grid-template-columns: 430px 1fr; align-items: center; gap: 0 16px; min-height: 80px; }
  .bl { font-size: 24px; font-weight: 700; color: #2b2e35; line-height: 1.2; }
  .bw { display: flex; align-items: center; gap: 16px; }
  .track { position: relative; width: 300px; height: 34px; border-left: 2px solid #9a9ea6; flex: none; }
  .fill { height: 34px; background: #a7acb4; border-radius: 0 3px 3px 0; }
  .hot .fill { background: #1e7a47; }
  .tick { position: absolute; top: -6px; height: 44px; border-left: 2px dashed #1d1d1f; }
  .tick span { position: absolute; top: 48px; left: -80px; width: 160px; text-align: center; font-size: 17px; color: #4a4e57; font-weight: 600; white-space: nowrap; }
  .bv { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; color: #3b3e46; line-height: 1; white-space: nowrap; }
  .hot .bv { color: #11643a; }
  .bv.pend { font-size: 21px; font-weight: 600; color: #8a8e97; font-style: italic; white-space: normal; }
  .cnt { display: block; font-size: 17px; font-weight: 500; color: #6b6f78; margin-top: 4px; }
  .foot { font-size: 19px; color: #7a7e87; margin-top: 26px; line-height: 1.35; border-top: 2px solid #e2e3e7; padding-top: 12px; }
  .foot b { color: #3a3d45; font-weight: 700; }
</style>
</head>
<body>
<div class="head">{{HEAD}}</div>
<div class="sub">{{SUB}}</div>
<div class="panels">
{{PANELS}}
</div>
{{BARS}}
<div class="foot">{{FOOT}}</div>
</body>
</html>
