<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fbfaf8; }
  body { width: 1200px; padding: 28px 36px 24px; font-family: "Inter", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
         color: #1d1d1f; -webkit-font-smoothing: antialiased; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
  .kick { font-size: 24px; line-height: 1.3; color: #2b2e35; background: #eef0f3; border-left: 6px solid #b3261e; padding: 8px 14px; border-radius: 6px; margin-bottom: 12px; }

  .head { font-size: 40px; font-weight: 800; letter-spacing: -0.015em; line-height: 1.15; }
  .sub { font-size: 24px; line-height: 1.3; color: #5a5d66; margin-top: 8px; }
  .sub b { color: #2b2e35; }
  .page { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: center; margin-top: 12px; }
  .pl { font-size: 22px; font-weight: 800; }
  .ask { justify-self: start; background: #2f6fe4; color: #fff; font-size: 22px; line-height: 1.3; border-radius: 16px 16px 4px 16px; padding: 7px 16px; }
  .code { background: #fff; border: 2px solid #d9dbe0; border-radius: 10px; padding: 6px 12px; font-size: 18px; line-height: 1.45; color: #5a5d66; }
  .code .hide { color: #1d1d1f; font-weight: 700; background: #e6e7ec; border-radius: 3px; }
  .code .ppl { font-family: "Inter", sans-serif; color: #8a8e97; font-size: 18px; }
  b.id { color: #b3261e; font-weight: 800; background: #fde3e0; border-radius: 3px; padding: 0 2px; }
  b.anc { color: #1d1d1f; background: #ffe58a; border-radius: 3px; padding: 0 2px; font-weight: 700; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
  .card { background: #eef0f3; border-radius: 18px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .ch { display: flex; align-items: center; gap: 10px; font-size: 24px; line-height: 1.2; }
  .ch b { font-weight: 800; }
  .ch span { display: block; font-size: 18px; color: #6b6f78; }
  .st { display: grid; grid-template-columns: 124px 1fr; gap: 2px 10px; background: #fff; border-radius: 12px; padding: 8px 10px; position: relative; }
  .sl { font-size: 17px; font-weight: 700; color: #6b6f78; line-height: 1.25; padding-top: 2px; }
  .sb { font-size: 20px; line-height: 1.3; color: #2b2e35; word-break: break-word; }
  .sb .mono { font-size: 17px; }
  .tag { display: table; margin-top: 4px; font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; border-radius: 6px; padding: 1px 8px; }
  .tag.yes { color: #fff; background: #b3261e; }
  .tag.no { color: #3b3e46; background: #e3e5ea; }
  .log .mono { font-size: 15px; } .log { font-size: 15px; color: #5a5d66; margin-top: 4px; } .log span:first-child { font-size: 15px; color: #8a8e97; }
  .law { margin-top: 2px; padding-top: 8px; border-top: 1px solid #d3d6dc; }
  .eq { font-size: 19px; line-height: 1.35; color: #3b3e46; }
  .eq b { font-size: 21px; color: #1d1d1f; }
  .eq span { color: #8a8e97; }
  .meas { font-size: 21px; margin-top: 4px; color: #3b3e46; }
  .meas b { font-size: 24px; } .meas b.in { color: #1d1d1f; } .meas b.out { color: #b3261e; }
  .track { position: relative; height: 30px; margin: 26px 0 2px 34px; }
  .bl { position: absolute; top: -22px; transform: translateX(-50%); font-size: 15px; color: #6b6f78; white-space: nowrap; }
  .meas .off { font-size: 19px; color: #6b6f78; }
  .axis0 { position: absolute; left: 0; right: 0; top: 14px; height: 2px; background: #c8cbd2; }
  .band { position: absolute; top: 4px; height: 22px; background: #d6dae2; border-radius: 4px; }
  .tick { position: absolute; top: 0; width: 4px; margin-left: -2px; height: 30px; background: #2b2e35; }
  .mdot { position: absolute; top: 6px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; border: 3px solid #fbfaf8; }
  .mdot.in { background: #1d1d1f; } .mdot.out { background: #b3261e; }
  .tl0, .tl1 { position: absolute; top: 4px; font-size: 16px; color: #8a8e97; }
  .tl0 { left: -30px; } .tl1 { right: -50px; }
  .key { font-size: 18px; color: #5a5d66; margin-top: 10px; }
  .key i { display: inline-block; vertical-align: -2px; }
  .foot { font-size: 18px; color: #6b6f78; margin-top: 12px; }
