[project]
name = "kran-research"
version = "0.1.0"
description = "Monorepo of small AI/LLM research projects that publish interactive figures to blog.kran.ai"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pandas>=2",
    "numpy>=1.26",
    "pyyaml>=6",
    "httpx>=0.27",
    "google-genai>=2.29.0",
    "scipy>=1.17.1",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "datasets>=5.1.0",
    "mlx>=0.32.3",
    "mlx-lm>=0.32.0",
    "openai>=3.31.0",
    "pyarrow>=26.0.0",
    "matplotlib>=3.11.2",
]

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
