[project]
name = "kran-research"
version = "0.1.0"
description = "Monorepo of small AI/LLM research projects that publish interactive figures to blog.kran.ai"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pandas>=2",
    "numpy>=1.26",
    "pyyaml>=6",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
